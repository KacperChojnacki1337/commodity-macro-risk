version: 2

models:
  - name: fct_construction_activity
    description: >
      Construction activity indicators from multiple sources, as a tall fact:
      one row per (period_date, source, indicator). Frequencies differ (monthly
      Eurostat, and GUS later) — each row keyed to its period's date in dim_date.
    columns:
      - name: activity_key
        description: Surrogate key over (period_date, source, indicator). Primary key.
        tests: [unique, not_null]
      - name: date_key
        description: FK to dim_date (period start).
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key
      - name: period_date
        tests: [not_null]
      - name: source_name
        description: Originating source (eurostat, gus, ...).
        tests: [not_null]
      - name: indicator
        description: What is measured.
        tests: [not_null]
      - name: frequency
        description: Reporting frequency (monthly, annual, ...).
        tests:
          - accepted_values:
              arguments:
                values: ["monthly", "annual", "quarterly"]
      - name: value
        description: The indicator value (unit-dependent).
        tests: [not_null]
      - name: unit
        description: Unit of the value.
